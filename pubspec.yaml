name: starter
description: "Mobile application for starter"

publish_to: 'none'

version: 3.0.0+1

workspace:
  - packages/starter_toolkit
  - packages/starter_uikit
  - packages/starter_lints

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_route: ^11.1.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_remote_config: ^6.5.1
  flutter_bloc: ^9.1.1
  flutter_form_builder: ^10.1.0
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  intl: ^0.20.2
  intl_utils: ^2.8.8
  json_annotation: ^4.9.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  starter_toolkit:
  starter_uikit:

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^8.4.0
  auto_route_generator: ^10.3.0
  bloc_test: ^10.0.0
  build_runner: ^2.12.0
  custom_lint: ^0.8.1
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  # custom_lint resolves plugins from the dependency spec, so this one keeps
  # an explicit path instead of bare workspace resolution
  starter_lints:
    path: ./packages/starter_lints


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/remote_config/

flutter_intl:
  enabled: true
  main_locale: en
  class_name: Localizer
  output_dir: lib/l10n/generated
