name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      strict_lint:
        description: Run strict custom_lint (fatal warnings, infos reported)
        required: false
        default: false
        type: boolean

jobs:
  flutter-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc
          flutter-version: '3.44.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Custom lint (warnings/info non-fatal)
        run: dart run custom_lint --no-fatal-infos --no-fatal-warnings

      - name: Analyze (warnings/info non-fatal)
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

  flutter-quality-strict:
    name: Flutter Quality (Strict Lints)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_lint }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc
          flutter-version: '3.44.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Custom lint (strict warnings)
        run: dart run custom_lint --no-fatal-infos

  flutter-tests:
    name: Flutter Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Root app is "." — packages/starter_lints and packages/starter_uikit are excluded,
        # neither has a test/ directory (uikit widget smoke tests live in the root app's
        # test/uikit/ instead).
        package:
          - .
          - packages/starter_toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc
          flutter-version: '3.44.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test --no-pub --reporter compact --concurrency 4
