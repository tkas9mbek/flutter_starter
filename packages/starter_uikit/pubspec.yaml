name: starter_uikit

description: "Mobile application for starter"

publish_to: 'none'

version: 3.1.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_route:
  bloc:
  bloc_concurrency:
  cached_network_image:
  collection:
  dio:
  equatable:
  flutter_bloc:
  flutter_form_builder:
  flutter_secure_storage:
  flutter_svg:
  form_builder_validators:
  freezed_annotation:
  get_it:
  image:
  image_picker:
  intl:
  intl_utils:
  modal_bottom_sheet:
  retrofit:
  shared_preferences:
  shimmer:
  starter_toolkit:

dev_dependencies:
  auto_route_generator:
  build_runner:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: SFUIText
      fonts:
        - asset: assets/fonts/SFUIText/SFUIText-Bold.ttf
          weight: 700
        - asset: assets/fonts/SFUIText/SFUIText-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SFUIText/SFUIText-Heavy.ttf
          weight: 900
        - asset: assets/fonts/SFUIText/SFUIText-HeavyItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/SFUIText/SFUIText-Light.ttf
          weight: 300
        - asset: assets/fonts/SFUIText/SFUIText-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/SFUIText/SFUIText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFUIText/SFUIText-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/SFUIText/SFUIText-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFUIText/SFUIText-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SFUIText/SFUIText-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFUIText/SFUIText-SemiboldItalic.ttf
          weight: 600
          style: italic
          
flutter_intl:
  enabled: true
  main_locale: en
  class_name: UikitLocalizer
  output_dir: lib/l10n/generated
